{{- if .Values.ui.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "private-registry.fullname" . }}-ui
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "private-registry.labels" . | nindent 4 }}
    app.kubernetes.io/component: ui
spec:
  replicas: {{ .Values.ui.replicaCount }}
  selector:
    matchLabels:
      {{- include "private-registry.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: ui
  template:
    metadata:
      labels:
        {{- include "private-registry.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: ui
    spec:
      securityContext:
        {{- toYaml .Values.ui.podSecurityContext | nindent 8 }}
      containers:
        - name: registry-ui
          securityContext:
            {{- toYaml .Values.ui.securityContext | nindent 12 }}
          image: "{{ .Values.ui.image.repository }}:{{ .Values.ui.image.tag }}"
          imagePullPolicy: {{ .Values.ui.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.ui.containerPort }}
              protocol: TCP
          env:
            - name: NGINX_LISTEN_PORT
              value: {{ .Values.ui.containerPort | quote }}
            - name: SINGLE_REGISTRY
              value: {{ .Values.ui.env.singleRegistry | quote }}
            - name: REGISTRY_TITLE
              value: {{ default (printf "%s Registry" .Release.Name) .Values.ui.env.title | quote }}
            # Proxied through this UI's nginx to the registry service, avoiding
            # browser-side CORS configuration on the registry itself.
            - name: NGINX_PROXY_PASS_URL
              value: {{ printf "http://%s:%v" (include "private-registry.fullname" .) .Values.service.port | quote }}
            - name: DELETE_IMAGES
              value: {{ .Values.ui.env.deleteImages | quote }}
            - name: SHOW_CATALOG_NB_TAGS
              value: {{ .Values.ui.env.showCatalogNbTags | quote }}
            - name: TAGLIST_PAGE_SIZE
              value: {{ .Values.ui.env.taglistPageSize | quote }}
            - name: CATALOG_ELEMENTS_LIMIT
              value: {{ .Values.ui.env.catalogElementsLimit | quote }}
            - name: REGISTRY_SECURED
              value: {{ .Values.auth.enabled | quote }}
            {{- with .Values.ui.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.ui.resources | nindent 12 }}
      {{- with .Values.ui.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.ui.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
